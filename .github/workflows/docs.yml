# SPDX-License-Identifier: AGPL-3.0-only
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Checks run on the pull request; main only builds and deploys.
      - if: github.event_name != 'push'
        run: pnpm --filter @skillpouch/docs typecheck
      - if: github.event_name != 'push'
        run: pnpm --filter @skillpouch/docs test
      - name: Build and verify llms.txt
        run: |
          pnpm --filter @skillpouch/docs build
          grep -q '^# SkillPouch' apps/docs/dist/llms.txt
          grep -q 'https://docs.skillpouch.net/llms-full.txt' apps/docs/dist/llms.txt
          grep -q '# skillpouch login' apps/docs/dist/llms-full.txt
      # Pull requests only build and test; deploys happen from main.
      - name: Cloudflare credentials
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; docs deploy skipped"
      # Plain npx, not wrangler-action: inside the pnpm workspace the action tries
      # `pnpm add wrangler` at the root, which pnpm refuses.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: ${{ runner.temp }}
        run: |
          # The first run creates the project; later runs only deploy.
          npx --yes wrangler@4 pages project create skillpouch-docs --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/apps/docs/dist" --project-name=skillpouch-docs --branch=main --commit-hash=${{ github.sha }}
