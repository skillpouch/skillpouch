# SPDX-License-Identifier: AGPL-3.0-only
# CI for the app (API, web app and shared packages): static checks, the full
# test suite (unit + integration + end-to-end over a real socket) against
# Postgres 16, a production build smoke test and the API image. It runs on
# pull requests only: main changes through merged pull requests, so a second
# run after the merge would test the same code again. The site and docs have
# their own workflows (`site.yml`, `docs.yml`).
name: app ci

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'deploy/docker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'eslint.config.js'
      - '.prettierrc.json'
      - '.github/workflows/app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Linux runners are pinned to ubuntu-24.04: a new `ubuntu-latest` image only
# arrives on purpose, not under a green build.
jobs:
  checks:
    name: lint · format · typecheck · contracts drift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Generated contracts are up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts/generated
      - name: OpenAPI spec is up to date
        run: pnpm openapi --check

  test:
    name: tests (unit · integration · e2e)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: End-to-end suite (explicit, real HTTP socket)
        run: pnpm --filter @skillpouch/api exec vitest run --project e2e

  build:
    name: production build + boot smoke test
    runs-on: ubuntu-24.04
    needs: [checks]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillpouch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 30
    env:
      # No SKILLPOUCH_MIGRATIONS_DIR: the bundle must find dist/migrations itself.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/skillpouch
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillpouch/api build
      - name: Migrate with the bundle
        working-directory: apps/api
        run: API_ROLE=migrate NODE_ENV=test node dist/main.mjs
      - name: Boot, probe, shut down gracefully
        working-directory: apps/api
        run: |
          NODE_ENV=test PORT=18080 METRICS_PORT=19464 SWAGGER=true node dist/main.mjs &
          PID=$!
          for _ in $(seq 1 30); do curl -fs localhost:18080/readyz && break; sleep 1; done
          curl -fs localhost:18080/healthz
          curl -fs -o /dev/null localhost:18080/docs
          curl -fs localhost:18080/docs/json | grep -q '"/v1/pouches/{pouchId}/operations"'
          curl -fs localhost:19464/metrics | grep -q skillpouch_http_request_duration_seconds
          kill -TERM $PID
          wait $PID
      - name: Worker boots, schedules jobs, shuts down gracefully
        working-directory: apps/api
        run: |
          API_ROLE=worker NODE_ENV=test METRICS_PORT=19465 node dist/main.mjs > worker.log 2>&1 &
          PID=$!
          for _ in $(seq 1 30); do grep -q '"worker started"' worker.log && break; sleep 1; done
          grep -q '"worker started"' worker.log
          kill -TERM $PID
          wait $PID

  web:
    name: web app build
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build of the web app
        run: pnpm --filter @skillpouch/web build

  image:
    name: API image
    runs-on: ubuntu-24.04
    needs: [test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: false
          tags: skillpouch/api:ci
          build-args: SKILLPOUCH_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
