# SPDX-License-Identifier: AGPL-3.0-only
# Deploys to the self-hosted server (runner label `skillpouch-server`, see
# docs.skillpouch.net/self-hosting/tunnel):
#   - automatically, on every push to main (the pull request already passed CI);
#   - by hand (Actions → deploy → Run workflow): a specific commit of main,
#     or a rollback to the previous API color.
# Only main is ever deployed and pull requests never reach the runner.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [deploy, rollback]
        default: deploy
      ref:
        description: Commit of main to deploy (empty = latest main)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SKILLPOUCH_DIR: ${{ vars.SKILLPOUCH_DIR || '/home/fenish/skillpouch' }}
  COMPOSE_FILE: compose.yaml:tunnel/compose.tunnel.yaml

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy')
    runs-on: [self-hosted, skillpouch-server]
    timeout-minutes: 60
    steps:
      - name: Build and deploy
        env:
          REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || 'origin/main' }}
        run: |
          if ! [[ "$REF" =~ ^([0-9a-f]{7,40}|origin/main)$ ]]; then echo "bad ref: $REF"; exit 1; fi
          # Pushes that only touch the site (Cloudflare Pages), CI or docs leave the
          # server alone; a manual deploy always runs.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            deployed=$(cat "$SKILLPOUCH_DIR/deploy/caddy/.deployed" 2>/dev/null || true)
            git -C "$SKILLPOUCH_DIR" fetch --quiet origin main
            if [ -n "$deployed" ] && git -C "$SKILLPOUCH_DIR" cat-file -e "$deployed^{commit}" 2>/dev/null; then
              server_files=$(git -C "$SKILLPOUCH_DIR" diff --name-only "$deployed" "$REF" \
                | grep -vE '^(apps/(site|docs)/|branding/|\.github/)|\.md$' || true)
              if [ -z "$server_files" ]; then
                echo "::notice::only site or docs changed since $deployed; server deploy skipped"
                exit 0
              fi
            fi
          fi
          "$SKILLPOUCH_DIR/deploy/tunnel/update.sh" --ref "$REF"
      - name: Health
        run: curl -fsS http://127.0.0.1/readyz

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: [self-hosted, skillpouch-server]
    timeout-minutes: 10
    steps:
      - name: Switch back to the previous API color
        run: |
          cd "$SKILLPOUCH_DIR/deploy"
          scripts/rollback.sh
          curl -fsS http://127.0.0.1/readyz
