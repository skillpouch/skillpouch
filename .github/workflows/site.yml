# SPDX-License-Identifier: AGPL-3.0-only
name: site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Checks run on the pull request; main only builds and deploys.
      - if: github.event_name != 'push'
        run: pnpm --filter @skillpouch/site typecheck
      - if: github.event_name != 'push'
        run: pnpm --filter @skillpouch/site test
      - name: Build and verify static pages
        run: |
          pnpm --filter @skillpouch/site build
          grep -q 'Your AI coding setup, on every computer.' apps/site/dist/index.html
          grep -q '"/_astro/' apps/site/dist/index.html
          grep -q 'https://app.skillpouch.net/sign-in' apps/site/dist/index.html
          grep -q 'Terms of Service' apps/site/dist/terms/index.html
          grep -q 'Privacy Policy' apps/site/dist/privacy/index.html
      # Pull requests only build and test; deploys happen from main.
      - name: Cloudflare credentials
        if: github.event_name != 'pull_request' && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; site deploy skipped"
      # Plain npx, not wrangler-action: inside the pnpm workspace the action tries
      # `pnpm add wrangler` at the root, which pnpm refuses.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: ${{ runner.temp }}
        run: |
          # The first run creates the project; later runs only deploy.
          npx --yes wrangler@4 pages project create skillpouch-site --production-branch=main || true
          npx --yes wrangler@4 pages deploy "$GITHUB_WORKSPACE/apps/site/dist" --project-name=skillpouch-site --branch=main --commit-hash=${{ github.sha }}
