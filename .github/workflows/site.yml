# SPDX-License-Identifier: AGPL-3.0-only
name: site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @skillpouch/site typecheck
      - run: pnpm --filter @skillpouch/site test
      - name: Build and verify static pages
        run: |
          pnpm --filter @skillpouch/site build
          grep -q 'Your AI coding setup, on every computer.' apps/site/dist/index.html
          grep -q '"/_astro/' apps/site/dist/index.html
          grep -q 'https://app.skillpouch.net/sign-in' apps/site/dist/index.html
          grep -q 'Terms of Service' apps/site/dist/terms/index.html
          grep -q 'Privacy Policy' apps/site/dist/privacy/index.html
      - name: Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; site deploy skipped"
      - uses: cloudflare/wrangler-action@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: npx wrangler pages project create skillpouch-site --production-branch=main || true
          command: pages deploy apps/site/dist --project-name=skillpouch-site --branch=main --commit-hash=${{ github.sha }}
